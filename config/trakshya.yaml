# TRAKSHYA-WAF Configuration
# Shared configuration for all components (Rust proxy, Go API)

database_path: trakshya_events.duckdb

global:
  log_level: info

proxy:
  port: 8080
  upstream_url: http://127.0.0.1:3000
  posture: monitor  # monitor | standard | under_attack
  management_api_url: http://127.0.0.1:8000

rate_limiter:
  enabled: true
  requests_per_minute: 120
  burst_size: 20

circuit_breaker:
  enabled: true
  failure_threshold: 5
  recovery_timeout_secs: 30
  half_open_max_requests: 3

api:
  port: 8000
  api_key: ""

geoip:
  enabled: false
  blocked_countries: []

jwt:
  enabled: false

trusted_ips:
  - 127.0.0.1
  - ::1
