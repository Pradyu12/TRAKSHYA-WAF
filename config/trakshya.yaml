# TRAKSHYA-WAF Production Configuration
# All values can be overridden with environment variables (see .env.example)

# Database path (DuckDB) — shared by Rust proxy and Go API
database_path: trakshya_events.duckdb

global:
  log_level: info

proxy:
  port: 8080
  upstream_url: http://127.0.0.1:3000
  posture: monitor  # monitor | standard | under_attack
  management_api_url: http://127.0.0.1:8000

rate_limiter:
  enabled: true
  requests_per_minute: 120
  burst_size: 20

circuit_breaker:
  enabled: true
  failure_threshold: 5
  recovery_timeout_secs: 30
  half_open_max_requests: 3

api:
  port: 8000
  api_key: ""  # Set a strong key in production

geoip:
  enabled: false
  blocked_countries: []

jwt:
  enabled: false
  secret: ""  # Set a strong secret in production
  required_role: admin

trusted_ips:
  - 127.0.0.1
  - ::1
