<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="logo-grad-rev" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="logo-glow" x1="50%" y1="0" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(5, 0)">
    <!-- Outer glow -->
    <path d="M45 5 L80 40 L68 76 L45 82 L22 76 L10 40 Z" fill="none" stroke="url(#logo-grad)" stroke-width="1" opacity="0.15"/>
    
    <!-- Outer shield -->
    <path d="M45 10 L78 42 L67 73 L45 78 L23 73 L12 42 Z" fill="none" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner shield -->
    <path d="M45 20 L72 46 L63 68 L45 72 L27 68 L18 46 Z" fill="none" stroke="url(#logo-grad-rev)" stroke-width="1.8" stroke-linejoin="round" opacity="0.75"/>
    
    <!-- Radar detection rings (concentric diamonds) -->
    <path d="M45 30 L66 50 L45 66 L24 50 Z" fill="none" stroke="#059669" stroke-width="1" opacity="0.35"/>
    <path d="M45 36 L57 50 L45 60 L33 50 Z" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    
    <!-- Center target -->
    <circle cx="45" cy="50" r="7" fill="none" stroke="url(#logo-grad)" stroke-width="2"/>
    <circle cx="45" cy="50" r="3" fill="#06b6d4"/>
    
    <!-- Radar sweep arc (active scanning visual) -->
    <path d="M45 50 L45 36" stroke="#059669" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 45 50" to="360 45 50" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Text -->
  <g transform="translate(95, 20)">
    <!-- TRAKSHYA -->
    <text x="0" y="42" font-family="'Inter', 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="4" fill="url(#logo-grad)">TRAKSHYA</text>
    
    <!-- Nexus subtitle -->
    <text x="0" y="64" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="8" fill="#64748b" style="text-transform:uppercase">WAF · SECURITY PLATFORM</text>
    
    <!-- Accent line -->
    <line x1="0" y1="72" x2="40" y2="72" stroke="url(#logo-grad)" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
