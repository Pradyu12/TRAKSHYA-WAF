name: Continuous Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate naming consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          files = [
              *root.glob('npm-package/*.json'),
              *root.glob('rust/*/Cargo.toml'),
              *root.glob('.github/workflows/*.yml'),
              'README.md',
          ]
          forbidden = ['kalki', 'KALKI', 'krsna-proxy', 'krsna-api']
          bad = []
          for path in files:
              text = Path(path).read_text(encoding='utf-8', errors='ignore')
              for token in forbidden:
                  if token in text:
                      bad.append((path, token))
          if bad:
              print('VALIDATION FAILED')
              for path, token in bad[:20]:
                  print(f'- {path}: {token}')
              raise SystemExit(1)
          print('VALIDATION OK')
          PY

      - name: Build and start live DuckDB API
        working-directory: go
        run: |
          go build -o /tmp/trakshya-api ./cmd/trakshya-api/
          TRAKSHYA_MGMT_PORT=8000 \
          TRAKSHYA_DUCKDB_PATH=/tmp/trakshya_events.duckdb \
          TRAKSHYA_FRONTEND_DIR=${{ github.workspace }}/frontend \
          /tmp/trakshya-api &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ready

      - name: Run WAF regression suite (live API)
        run: python scripts/regression.py
        env:
          TRAKSHYA_REGRESSION_BASE: 'http://127.0.0.1:8000'
          TRAKSHYA_PROXY_BASE: 'http://127.0.0.1:8000'
