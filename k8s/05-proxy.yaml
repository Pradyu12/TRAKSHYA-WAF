apiVersion: apps/v1
kind: Deployment
metadata:
  name: trakshya-proxy
  namespace: trakshya-waf
  labels:
    app.kubernetes.io/name: trakshya-waf
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trakshya-waf
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trakshya-waf
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: proxy
          image: pradyu12/trakshya-waf-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          env:
            - name: TRAKSHYA_CONFIG
              value: /etc/trakshya/config.yaml
            - name: TRAKSHYA_PROXY_PORT
              value: "8080"
            - name: TRAKSHYA_UPSTREAM_URL
              value: http://trakshya-api.trakshya-waf.svc.cluster.local:8000
            - name: TRAKSHYA_MGMT_API_URL
              value: http://trakshya-api.trakshya-waf.svc.cluster.local:8000
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: config
              mountPath: /etc/trakshya
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: trakshya-config
            items:
              - key: trakshya.yaml
                path: config.yaml
