apiVersion: apps/v1
kind: Deployment
metadata:
  name: trakshya-api
  namespace: trakshya-waf
  labels:
    app.kubernetes.io/name: trakshya-waf
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trakshya-waf
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trakshya-waf
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: pradyu12/trakshya-waf-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: trakshya-env
            - secretRef:
                name: trakshya-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/trakshya
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trakshya-data
        - name: config
          configMap:
            name: trakshya-config
            items:
              - key: trakshya.yaml
                path: config.yaml
