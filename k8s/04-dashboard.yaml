apiVersion: apps/v1
kind: Deployment
metadata:
  name: trakshya-dashboard
  namespace: trakshya-waf
  labels:
    app.kubernetes.io/name: trakshya-waf
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trakshya-waf
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trakshya-waf
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: pradyu12/trakshya-waf-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TRAKSHYA_API_UPSTREAM
              value: trakshya-api.trakshya-waf.svc.cluster.local:8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
