version: "3.8"

services:
  trakshya-api:
    build:
      context: .
      dockerfile: go/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TRAKSHYA_MGMT_PORT=8000
      - TRAKSHYA_DUCKDB_PATH=/data/trakshya_events.duckdb
      - TRAKSHYA_FRONTEND_DIR=/opt/trakshya/frontend
      - TRAKSHYA_API_KEY=${TRAKSHYA_API_KEY:-}
    volumes:
      - trakshya-duckdb:/data
      - ./frontend:/opt/trakshya/frontend:ro
    networks:
      - trakshya-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  trakshya-proxy:
    build:
      context: ./rust
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TRAKSHYA_CONFIG=/etc/trakshya/config.yaml
      - TRAKSHYA_PROXY_PORT=8080
      - TRAKSHYA_UPSTREAM_URL=http://trakshya-api:8000
      - TRAKSHYA_MGMT_API_URL=http://trakshya-api:8000
      - RUST_LOG=info
    volumes:
      - ./config/trakshya.yaml:/etc/trakshya/config.yaml:ro
    depends_on:
      trakshya-api:
        condition: service_healthy
    networks:
      - trakshya-net
    restart: unless-stopped

  trakshya-systemd:
    build:
      context: ./c
      dockerfile: Dockerfile
    ports:
      - "9001:9001"
    volumes:
      - /var/log:/var/log:ro
      - /etc:/etc:ro
      - trakshya-duckdb:/var/lib/trakshya
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    networks:
      - trakshya-net
    restart: unless-stopped
    profiles:
      - full

networks:
  trakshya-net:
    driver: bridge

volumes:
  trakshya-duckdb:
