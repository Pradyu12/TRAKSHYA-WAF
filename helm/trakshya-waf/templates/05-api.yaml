{{- $name := include "trakshya-waf.fullname" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "trakshya-waf.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "trakshya-waf.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "trakshya-waf.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: TRAKSHYA_MGMT_PORT
              value: "8000"
            - name: TRAKSHYA_DUCKDB_PATH
              value: /data/trakshya_events.duckdb
            - name: TRAKSHYA_FRONTEND_DIR
              value: /opt/trakshya/frontend
            - name: TRAKSHYA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-secrets
                  key: TRAKSHYA_API_KEY
            - name: TRAKSHYA_MGMT_API_URL
              value: http://{{ $name }}-api.{{ .Values.global.namespace }}.svc.cluster.local:8000
            - name: DEPLOYMENT_MODE
              value: kubernetes
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
